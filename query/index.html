<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#fff;padding:20px 16px;}
.page{display:none;min-height:100vh;}
.page.active{display:block;}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.back{font-size:22px;cursor:pointer;}
.title{font-size:18px;font-weight:600;flex:1;text-align:center;margin-right:30px}
.page-title{font-size:32px;font-weight:bold;text-align:center;margin-bottom:16px;line-height:1.3}
.desc{text-align:center;color:#999;font-size:15px;margin-bottom:40px;line-height:1.5}
.form-box{display:flex;gap:8px;margin-bottom:24px}
.input-text{flex:1;padding:14px 16px;border:1px solid #eee;border-radius:99px;font-size:16px;outline:none}
.btn-submit{background:#3478f6;color:white;border:none;padding:14px 22px;border-radius:99px;font-size:16px;cursor:pointer;}
.warn-text{color:#999;font-size:14px;line-height:1.6;margin-bottom:24px}
.tip-box{background:#fff8e6;border-radius:12px;padding:18px;margin-bottom:40px}
.tip-title{display:flex;align-items:center;gap:6px;color:#f5a623;font-size:16px;font-weight:600;margin-bottom:12px}
.tip-list{font-size:14px;color:#333;line-height:1.8}
.tip-list p{margin:6px 0}
.red-text{color:#ff3b30;font-weight:500;margin-top:12px}
.captcha-mask{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9998;
}
.captcha-mask.show{display:flex;}
.captcha-pop{
    background:#fff;border-radius:16px;width:100%;max-width:360px;padding:24px;
}
.pop-title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:20px;}
.canvas-wrap{text-align:center;margin-bottom:16px;}
#captchaCanvas{border:1px solid #ddd;border-radius:8px;}
.pop-input{width:100%;padding:14px 12px;border:1px solid #eee;border-radius:10px;font-size:16px;margin-bottom:10px;outline:none;}
.err-tip{color:red;text-align:center;height:22px;margin-bottom:12px;}
.pop-buttons{display:flex;gap:12px;margin-top:10px;}
.btn-cancel{flex:1;padding:14px;border:0;background:#f2f2;border-radius:12px;font-size:17px;cursor:pointer;}
.btn-confirm{flex:1;padding:14px;border:0;background:#3478f6;color:#fff;border-radius:12px;font-size:17px;}
.tab-wrap{display:flex;border-bottom:1px solid #eee;margin:40px 0 120px;}
.tab-item{flex:1;text-align:center;padding:14px;font-size:17px;cursor:pointer;}
.tab-item.active{font-weight:bold;border-bottom:2px solid #000;}
.empty-box{text-align:center;color:#999;}
.empty-icon{font-size:60px;margin-bottom:12px;color:#ccc;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.order-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 16px;
    margin: 10px 8px 14px;
    background: #fff;
}
.order-line {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    line-height: 2;
}
.order-label {
    color: #666;
}
.order-price {
    color: #f44336;
    font-weight: bold;
}
.view-card-btn{
    background:#2962ed;color:#fff;border:0;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;
}
.page-card{background:#f5f5f7 !important;padding:0 0 40px 0;}
.card-header{
    display:flex;
    align-items:center;
    padding:16px;
    background:#ffffff;
}
.card-back{
    font-size:22px;
    cursor:pointer;
    width:32px;
}
.card-h-title{
    flex:1;
    text-align:center;
    font-size:19px;
    font-weight:600;
    margin-right:32px;
}
.wrap{padding:16px;max-width:750px;margin:0 auto;}
.order-info-card{
    background:#fff;
    border-radius:14px
